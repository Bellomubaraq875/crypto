<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="preconnect" href="https://api.coingecko.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0d16" />
    <meta name="description" content="Cryptoc: live crypto prices, charts, portfolio tracking and news." />
    <title>Cryptoc – Live crypto prices, portfolio & news</title>
    <style>
      /* paints instantly, before any JavaScript runs */
      html[data-theme="light"] body { background: #f3f5fa; }
      body { margin: 0; background: #0a0d16; }
      .boot { min-height: 100vh; display: grid; place-items: center; }
      .boot img { width: 72px; height: 72px; border-radius: 20px; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { 50% { transform: scale(.92); opacity: .65; } }
    </style>
    <script>
      try { var t = localStorage.getItem("cryptoc:theme"); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><div class="boot"><img src="/logo.svg" alt="Cryptoc" /></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
